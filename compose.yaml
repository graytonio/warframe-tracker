# Fixed project name so every git worktree shares one dev database container.
name: warframe-tracker
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warframe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warframe"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
