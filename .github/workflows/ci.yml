name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # PR and tag caches are only visible to that ref, so saving them just evicts main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run lint
      # Starts postgres via docker compose, then runs cargo test.
      - run: mise run test

  # wft-sync ships for Windows; catch a Windows-only break before a release does.
  sync-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p wft-sync

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Builds the release image so main keeps a warm layer cache that tag releases can read
  # (a tag run can only restore caches saved by that tag or by main).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          # amd64 only: every homelab node is amd64, and arm64 under QEMU was most of the build time.
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=docker,mode=max' || '' }}
